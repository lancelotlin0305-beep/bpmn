<text x="681" y="1215.0" font-size="11.5" fill="#3a4a59">名+身分證號呼叫刑案管</text>
<text x="681" y="1229.0" font-size="11.5" fill="#3a4a59">理系統API將判讀結果</text>
<text x="681" y="1243.0" font-size="11.5" fill="#3a4a59">寫入暫存區;使用者點選</text>
<text x="681" y="1257.0" font-size="11.5" fill="#3a4a59">AI引用時由系統自暫存</text>
<text x="681" y="1271.0" font-size="11.5" fill="#3a4a59">區讀取(RFP工項要求</text>
<text x="681" y="1285.0" font-size="11.5" fill="#3a4a59">API整合);引用→否</text>
<text x="681" y="1299.0" font-size="11.5" fill="#3a4a59">時由統計處收集不符資訊</text>
<text x="681" y="1313.0" font-size="11.5" fill="#3a4a59">,回饋進行判讀邏輯調整</text>
