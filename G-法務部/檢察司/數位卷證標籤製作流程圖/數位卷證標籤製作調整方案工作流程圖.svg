<text x="451" y="749.0" font-size="11.5" fill="#3a4a59">,若可直接下載,即免以</text>
<text x="451" y="763.0" font-size="11.5" fill="#3a4a59">列印重製PDF、匯入後</text>
<text x="451" y="777.0" font-size="11.5" fill="#3a4a59">亦免重跑OCR辨識,可</text>
<text x="451" y="791.0" font-size="11.5" fill="#3a4a59">直接做卷證類型辨識與關</text>
<text x="451" y="805.0" font-size="11.5" fill="#3a4a59">鍵資訊擷取;可行性待確</text>
<text x="451" y="819.0" font-size="11.5" fill="#3a4a59">認</text>
